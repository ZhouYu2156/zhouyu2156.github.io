<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .grid-background {
      width: 100vw;
      height: 100vh;
      background-image: linear-gradient(rgba(0, 213, 255, 0.1) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 213, 255, 0.077) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .dot-bg {
      min-height: 100vh;
      background-color: #eff0f3;
      background-image: radial-gradient(circle,
          rgba(98, 102, 103, 0.2) 2px,
          transparent 0px);
      background-size: 2rem 2rem;
    }
  </style>
</head>

<body>
  <div class="dot-bg" style="min-height: 100vh;"></div>
</body>

</html>
