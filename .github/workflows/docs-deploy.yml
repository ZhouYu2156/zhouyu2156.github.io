# 文档站：构建 VitePress → rsync 到自有服务器 → GitHub Pages
#
# Repository secrets（Settings → Secrets and variables → Actions）：
#   DEPLOY_HOST、DEPLOY_PATH、SSH_PRIVATE_KEY（私钥须与 deployer 的 authorized_keys 成对）
# 服务器：sshd、rsync；用户 deployer；运维说明见 docs 内「自动化部署」笔记。
# Pages：Settings → Pages → Source 选 GitHub Actions。

name: 📖 文档站点部署

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'patches/**'
      - 'scripts/**'
      - 'template/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 🔧 构建与分发
    runs-on: ubuntu-latest

    steps:
      - name: 🔍 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📌 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 🟢 配置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 🔨 构建文档站
        run: pnpm run docs:build

      - name: ✅ 校验构建产物
        run: |
          set -euo pipefail
          test -d docs/geektu
          test -n "$(ls -A docs/geektu 2>/dev/null)"
          echo "构建产物文件数: $(find docs/geektu -type f | wc -l)"

      - name: 🚀 同步到服务器（rsync）
        uses: burnett01/rsync-deployments@v8
        with:
          switches: -avzr --delete
          path: docs/geektu/
          remote_host: ${{ secrets.DEPLOY_HOST }}
          remote_path: ${{ secrets.DEPLOY_PATH }}
          remote_user: deployer
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📤 上传 GitHub Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/geektu

  deploy:
    name: 🌐 发布 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🌍 部署 Pages
        id: deployment
        uses: actions/deploy-pages@v4
