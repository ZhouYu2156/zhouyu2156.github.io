# 文档站点（VitePress @ apps/web）在推送到 main 后构建并部署到 GitHub Pages。
#
# 仓库设置（一次性）：
# 1. Settings → Pages → Build and deployment → Source 选择「GitHub Actions」。
# 2. 若站点地址为 https://<用户>.github.io/<仓库名>/（项目页），请在 apps/web/.vitepress/config.mts
#    中设置 base: '/<仓库名>/'；若为用户站点 root 域名或自定义域名，可保持默认 base: '/'.
#
# pnpm 工作区根目录即仓库根目录（与 pnpm-workspace.yaml 一致）。

name: 文档站点部署

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ⚡️ 构建 VitePress 文档站点
    runs-on: ubuntu-latest
    steps:
      - name: 🔍️ 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: 🟢 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 🔨 构建 VitePress
        run: pnpm run build

      - name: 📤 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/company

  deploy:
    name: 🚀 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
