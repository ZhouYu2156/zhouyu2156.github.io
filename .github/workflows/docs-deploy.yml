# 极客兔笔记站：推送到 main 后构建 docs 工作区包并部署到 GitHub Pages。
#
# 构建命令与根 package.json 一致：
#   docs:build = pnpm build && pnpm docs:build:only
#   docs:build:only = pnpm -F=docs build（即 docs 包内的 vitepress build）
#
# 仓库设置：Settings → Pages → Source 选「GitHub Actions」。

name: 📖 文档站点部署

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'src/**'
      - 'patches/**'
      - 'scripts/**'
      - 'template/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: ⚡️ 构建 VitePress 文档站点
    runs-on: ubuntu-latest
    steps:
      - name: 🔍️ 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔧 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: 🟢 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 📦 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 🔨 构建 VitePress 与文档站
        run: pnpm run docs:build

      - name: 📤 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/geektu

  deploy:
    name: 🚀 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
