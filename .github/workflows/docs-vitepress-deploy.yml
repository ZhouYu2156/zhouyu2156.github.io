# 极客兔笔记站：在仓库根推送后，构建 apps/vitepress 内的 docs 并部署到 GitHub Pages。
#
# 设计原则（不依赖、也不修改 apps/vitepress 源码树里的「编排脚本」）：
# - 依赖安装：仅在仓库根执行 pnpm install（lockfile、patches、workspace 在根目录）。
# - 构建：在根目录用 pnpm --dir 依次执行上游 package.json 里已有的标准脚本：
#     1) apps/vitepress  → pnpm run build     （编译 VitePress 本体，产出 dist/）
#     2) apps/vitepress/docs → pnpm run build （即 vitepress build，使用 docs 内既有配置）
# - 不在本 workflow 里改 apps/vitepress 下任何文件；站点 base/outDir 等仍由 docs 侧既有配置决定。
#
# 与 apps/web 的 docs-deploy 若同时部署到同一 GitHub Pages，后完成的会覆盖先完成的；请只启用其一或合并产物。
#
# 仓库设置：Settings → Pages → Source 选「GitHub Actions」。

name: 极客兔笔记站部署

on:
  push:
    branches: [main]
    paths:
      - 'apps/vitepress/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - '.github/workflows/docs-vitepress-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-vitepress
  cancel-in-progress: false

jobs:
  build:
    name: 构建 VitePress 笔记站
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: 使用 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 安装依赖（仓库根）
        run: pnpm install --frozen-lockfile

      # 两步均使用上游各 package.json 已有脚本名，不在 apps/vitepress 内写死组合命令。
      - name: 编译 VitePress 本体（apps/vitepress）
        run: pnpm --dir apps/vitepress run build

      - name: 构建文档站（apps/vitepress/docs）
        run: pnpm --dir apps/vitepress/docs run build

      - name: 上传 Pages 构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          # 与 docs/.vitepress 中 outDir 一致；若上游改为其它目录，仅改此处即可，不必改上游配置。
          path: apps/vitepress/docs/geektu

  deploy:
    name: 部署到 GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
